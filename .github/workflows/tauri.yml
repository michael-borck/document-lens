# Shared release pipeline: michael-borck/app-hq/.github/workflows/tauri-release.yml
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/tauri-release.yml@main
    with:
      product-name: Document Lens
      install-command: npm ci
      build-command: bash scripts/build-sidecar.sh
      preflight-command: bash scripts/check-release.sh --tag "$GITHUB_REF_NAME"
      notarize-args: --config src-tauri/tauri.release.conf.json
      matrix: |
        [
          {"platform":"macos-15","target":"aarch64-apple-darwin","args":"--config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin"},
          {"platform":"windows-latest","target":"x86_64-pc-windows-msvc","args":"--config src-tauri/tauri.release.conf.json --target x86_64-pc-windows-msvc"}
        ]
      updater: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
